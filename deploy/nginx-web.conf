# @WEB_DOMAIN@ — portfolio SPA (Clients/dist) + same-origin proxy to the API
# rendered by deploy/deploy.sh — TLS listen + redirect are generated when the certificate exists
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# www → apex (canonical host)
server {
@LISTEN@
    server_name @WWW_DOMAIN@;
    return 301 $scheme://@WEB_DOMAIN@$request_uri;
}

server {
@LISTEN@
    server_name @WEB_DOMAIN@;
    root @APP_DIR@/@FRONTEND@/dist;
    index index.html;

    client_max_body_size 40m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), fullscreen=(self \"https://@API_DOMAIN@\")" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://@API_DOMAIN@ https://api.github.com; frame-src 'self' blob: https://@API_DOMAIN@; object-src 'self' blob: https://@API_DOMAIN@; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (same origin → no CORS, cookies not needed)
    location /api/ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    # uploaded media: served by the API from UPLOAD_DIR
    location /uploads/ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # hashed build assets: cache forever
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?|pdf)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # SPA routes (dashboard lives under /admin)
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
@REDIRECT@
